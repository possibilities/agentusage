[project]
name = "agentusage-py"
version = "0.1.0"
description = "Scrape Claude/Codex usage per account and expose a round-robin profile picker"
requires-python = ">=3.11"
dependencies = [
    "pexpect>=4.9",
    "pyte>=0.8.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: marks tests that spawn a real claude/codex TUI (deselect with '-m \"not live\"')"]
addopts = ["--strict-markers", "-m", "not live"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.11"
reportUnusedParameter = "none"
reportUnusedVariable = "none"
