[project]
name = "agentuse-py"
version = "0.1.0"
description = "Scrape Claude/Codex usage per account and expose a round-robin profile picker"
requires-python = ">=3.11"
dependencies = [
    "pexpect>=4.9",
    "pyte>=0.8.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentuse"]
only-packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
reportUnusedParameter = "none"
